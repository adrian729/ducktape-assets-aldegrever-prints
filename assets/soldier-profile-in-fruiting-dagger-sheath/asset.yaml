id: soldier-profile-in-fruiting-dagger-sheath
title: Dagger sheath with soldier's head
description: A tall tapering ornament designed for a dagger sheath. At the top a helmeted soldier's head in profile faces left inside a wreath of leaves and buds; below it a stem runs down the centre through curled acanthus leaves, a volute and rows of pod-like fruits hanging from short stems, narrowing to a point at the bottom. Black line work with cream paper-toned fills on a transparent background.

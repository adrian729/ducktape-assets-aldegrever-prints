id: seated-child-holding-tall-leafy-scroll
title: Seated putto holding a leaf scroll
description: An upright foliate ornament. A nude putto sits at the bottom centre facing the viewer, holding an upright stem in one hand and a curling stem in the other; from these a tall acanthus scroll branches upward and sideways with broad curled leaves, tulip-like buds and a trumpet flower, filling a roughly rectangular field. Brown-black line work with cream and tan paper-toned fills on a transparent background.

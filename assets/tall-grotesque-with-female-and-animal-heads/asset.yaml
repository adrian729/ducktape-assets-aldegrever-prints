# descriptive: find it and understand it
id: tall-grotesque-with-female-and-animal-heads
title: Grotesque with winged woman and lion heads
description: A tall narrow foliate grotesque cut from the Ornament with Naked Couple sheet. A woman's bust with curled ram's horns and leafy wings faces the viewer at the top under two hanging bell flowers; below her a layered acanthus calyx carries two lion-like heads in profile facing inward, a frowning cat-like mask stares out from the centre, and curled leaves descend to a scalloped cup terminal at the bottom. Black line work with cream paper-toned fills on a transparent background.

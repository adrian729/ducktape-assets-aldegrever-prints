# descriptive: find it and understand it
id: two-boys-with-vine-scroll
title: Two putti in a vine-leaf scroll
description: A wide horizontal foliate panel. A nude boy stands at the far left facing right, one hand on his hip and the other raised to a stem; a second nude boy stands near the centre facing right, grasping a stem above his head and stretching his other arm along the scroll; thin curling stems with broad lobed vine leaves fill the rest of the panel to the right edge. Brown-black line work with cream and tan paper-toned fills on a transparent background.

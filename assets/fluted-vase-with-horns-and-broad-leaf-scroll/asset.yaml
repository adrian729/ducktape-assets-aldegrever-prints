id: fluted-vase-with-horns-and-broad-leaf-scroll
title: Fluted vase with trumpet horns and leaf scroll
description: A horizontal foliate ornament. A gadrooned vase at the bottom centre sends up a straight stem with layered acanthus leaves, and two flared trumpet-shaped horns lean outward above it; broad curled leaves, hanging bell flowers and pea-pod-like buds spread symmetrically to both sides, with a bell flower cut off at each edge. Brown-black line work with cream and tan paper-toned fills on a transparent background.

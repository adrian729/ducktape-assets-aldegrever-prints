# descriptive: find it and understand it
id: child-gripping-wide-foliate-scroll
title: Putto gripping a wide leaf scroll
description: A wide horizontal foliate panel. A nude putto crouches at the centre with its head turned to the left, gripping the stems that run through both hands, while a small bell flower rises above its head; broad lobed leaves on thin curling stems spread symmetrically to both ends, with a small bud at each edge. Brown-black line work with cream and tan paper-toned fills on a transparent background.

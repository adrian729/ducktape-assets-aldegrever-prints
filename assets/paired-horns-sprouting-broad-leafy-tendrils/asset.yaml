# descriptive: find it and understand it
id: paired-horns-sprouting-broad-leafy-tendrils
title: Two horns with vine-leaf scroll
description: A wide horizontal foliate panel. Two short horns rise from a central pair of volutes and are tied together by a bow at the top, with an upright vine leaf between them; broad lobed leaves on curling stems spread symmetrically to both ends, with volutes along the base and a curled leaf at each outer corner. Brown-black line work with cream and tan paper-toned fills on a transparent background.

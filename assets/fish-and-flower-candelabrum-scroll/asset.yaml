id: fish-and-flower-candelabrum-scroll
title: Candelabrum with fish and roses
description: A tall narrow symmetrical foliate candelabrum. A thin central shaft rises through tiers of acanthus leaves and volutes; two fish-tailed dolphins with open jaws face each other across the middle, two more look outward at the base, and round roses sit in the volutes near the top under a small finial. Black and grey line work with cream paper-toned fills on a transparent background.

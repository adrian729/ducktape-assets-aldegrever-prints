# descriptive: find it and understand it
id: nude-couple-standing
title: Nude couple standing
description: A nude man and woman stand side by side, cut from the Ornament with Naked Couple sheet. The woman at the left faces the viewer with her head turned toward the man, her braided hair streaming out to the left, a girdle at her hips and a small rod held upright in her right hand; the man at the right stands in profile facing left, one arm around her shoulders and his open hand under hers. Fine black engraved hatching with cream paper-toned skin on a transparent background.

# descriptive: find it and understand it
id: leafy-shaft-with-bearded-and-lion-masks
title: Leafy shaft with bearded mask and lion mask
description: A tall narrow symmetrical foliate ornament. From a hairy bearded mask at the base, flanked by two pod-like gourds on curled stems that end in lion paws, a central shaft rises through a lion mask set in a shield-shaped cartouche, two roses, a ribbon and a bearded mask with wild hair, up to a leafy calyx with two volute horns, beads and hanging buds at the top; thin acanthus stems curl outward along the whole height. Black line work with cream paper-toned fills on a transparent background.

# descriptive: find it and understand it
id: paired-tendrils
title: Tendril panel with AG monogram
description: A horizontal opaque engraved panel on a dark cross-hatched ground. A stem rises from a small block bearing the AG monogram at the bottom centre to a bud at the top, and two leafy tendrils curl outward from it into large volutes at either end, with lobed leaves filling the corners. Cream leaves on a black hatched ground; only the margin outside the panel is transparent.

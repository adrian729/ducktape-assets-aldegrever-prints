id: two-satyr-couples-on-foliate-candelabrum
title: Candelabrum with two pairs of satyrs
description: A tall candelabrum grotesque in two tiers. At the top two satyrs seated on scrolls, a long-haired one at the left and a goat-horned bearded one at the right, raise a tiered fluted vase of foliage with a small lizard among its leaves; a palmette separates the tiers. Below, a female satyr with a plumed headdress at the left and a bearded male at the right sit facing a horned goat skull at the centre, each holding a curved horn; all four have goat legs and hooves. Black line work with cream paper-toned fills on a transparent background.

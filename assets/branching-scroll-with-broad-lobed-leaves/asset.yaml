id: branching-scroll-with-broad-lobed-leaves
title: Branching leaf scroll with bell flower
description: A horizontal foliate ornament. From a leafy base at the bottom centre a straight stem rises to a bell-shaped flower on a ringed collar, and symmetrical stems branch to either side, curling into volutes dressed with broad lobed leaves and drooping buds. Tan-cream fills with dark brown hatching on a transparent background.

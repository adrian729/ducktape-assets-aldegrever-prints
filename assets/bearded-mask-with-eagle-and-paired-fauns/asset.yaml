id: bearded-mask-with-eagle-and-paired-fauns
title: Bearded mask with eagle, cornucopias and fauns
description: A nearly rectangular engraved grotesque. A large bearded mask with a furrowed brow stares out from the centre under a pine-cone finial on a stand; two fruit-filled cornucopias hung with ribbons flank it, and a parrot-like bird perches on a scroll in each upper corner. At the lower sides two horned fauns with scaled fish tails face inward, holding a cloth that drapes behind an eagle with spread wings and talons at the bottom centre. Brown-black line work with cream paper-toned fills on a transparent background.

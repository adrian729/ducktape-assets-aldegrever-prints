id: female-headed-beasts-candelabrum
title: Candelabrum with female-headed beasts and lizards
description: A tall candelabrum grotesque. A hairy mask at the top holds ribbons and stems in its mouth; below it two feline-bodied beasts with raised tails stand back to back, their long necks ending in two women's heads at the sides, and a blank tablet hangs between them above a palmette. Two flaming bowls stand on fluted brackets at the sides, and two lizard-like beasts grip the stems at the bottom around a cup with ears of grain. Tan-cream fills with dark brown hatching on a transparent background.

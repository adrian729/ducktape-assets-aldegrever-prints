id: urn-with-three-tiers-of-foliate-scrolls
title: Urn candelabrum with three tiers of flowers
description: A tall narrow symmetrical candelabrum. From a gadrooned urn at the bottom a central shaft rises through three tiers of paired volutes, each holding a large round flower, past a shouting mask in the lower middle and a blank tablet in the upper middle, to a cup with ears of grain at the top; thin acanthus stems with small leaves and beads fill the sides. Tan-cream fills with dark brown hatching on a transparent background.

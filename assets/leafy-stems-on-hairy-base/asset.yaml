# descriptive: find it and understand it
id: leafy-stems-on-hairy-base
title: Leafy stems on a hairy base
description: A narrow upright strip cut from the Ornament with Naked Couple sheet. Grass-like stalks with small lobed leaves and buds rise from a rounded tuft of hair-like hatching at the bottom; the left side is a straight cut where the couple stood in the print. Black line work with cream paper-toned fills on a transparent background.
type: ornament

id: bearded-mask-with-tritons-and-two-children
title: Grotesque with mask, goat heads and children
description: A nearly rectangular engraved grotesque. A large bearded mask with an open mouth fills the centre; above it a small bearded man sits astride its crest and stretches a cloth to two horned goat heads in the upper corners, while a booted man in a jerkin perches on a cornucopia at either side. Below, a nude child rides a woman's bust at the left and another stands on a bearded satyr's head at the right; a lion mask with a draped cloth and a small lower mask among acanthus leaves close the bottom. Brown-black line work with cream paper-toned fills on a transparent background.

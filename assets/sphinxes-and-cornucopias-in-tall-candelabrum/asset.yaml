id: sphinxes-and-cornucopias-in-tall-candelabrum
title: Candelabrum with sphinxes and cornucopias
description: A tall narrow symmetrical candelabrum grotesque. Two winged sphinxes with women's heads sit back to back at the base, their wings rising into volutes; above them two fruit-filled cornucopias cross under a knotted ribbon, two roses sit in the scrolls, a bearded mask with leafy hair faces out from the upper middle between two butterflies, and two large flowers hang from the volutes under a small vase finial, all joined by thin acanthus stems and strings of beads. Black line work with cream paper-toned fills on a transparent background.

# descriptive: find it and understand it
id: tall-shaft-with-masks-and-dolphins
title: Leafy shaft with two masks and dolphins
description: A tall narrow symmetrical foliate ornament. Under a leafy crown at the top two bearded grotesque masks in profile face outward; below them two dolphin-like creatures with open jaws curl away from the shaft, two small roses sit on the stems, a fluted collar holds hanging pear-shaped pods, and tiers of broad acanthus leaves, volutes and pea pods descend to a leafy base. Brown-black line work with cream and tan paper-toned fills on a transparent background.

id: two-children-in-tall-fruiting-leaf-scroll
title: Two putti under a tall leaf scroll
description: A tall narrow foliate panel. Two putti sit at the bottom, one in a short tunic facing right behind a nude one facing the viewer, both holding stems; above them a dense scroll of thin stems with lobed leaves, buds and pod-like fruits fills the whole height. Tan-cream fills with dark brown hatching on a transparent background.

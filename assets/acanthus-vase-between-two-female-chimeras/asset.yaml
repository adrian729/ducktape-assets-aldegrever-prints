# descriptive: find it and understand it
id: acanthus-vase-between-two-female-chimeras
title: Vase between two female chimeras
description: An upright engraved panel. A lidded fluted vase with a bearded mask on its bowl stands at the centre on a pair of scaly serpent coils; a female chimera stands at either side, with a woman's head and torso, a scaled lower body curling into a serpent tail and lion-pawed feet, each gripping the vase rim. From the vase rise acanthus leaves and thin stems that curl symmetrically into two large tulip-like flowers, two round blossoms and small leaf tendrils up to a central finial. Black and grey line work with cream paper-toned fills; the background is transparent.
